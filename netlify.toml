[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_API_URL = "https://ecotrack-ai-tdq4.onrender.com/api"

# Proxy API requests to Render backend
[[redirects]]
  from = "/api/*"
  to = "https://ecotrack-ai-tdq4.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback - all other routes serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
